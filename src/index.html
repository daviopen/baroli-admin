<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#b01f2e">
  <title>Baroli Admin</title>
  <link rel="preconnect" href="https://widesysw2689.s3.amazonaws.com" crossorigin>
  <link rel="icon" href="https://widesysw2689.s3.amazonaws.com/images/logo-1x1.jpg">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="stylesheet" href="/styles/shell.css?v=20260908-sidebar-2">
  <link rel="stylesheet" href="/styles/users.css">
  <link rel="stylesheet" href="/styles/profile.css">
  <link rel="stylesheet" href="/styles/lease-termination.css">
  <link rel="stylesheet" href="/styles/data-import.css">
  <link rel="stylesheet" href="/styles/tasks.css">
  <script src="/config/runtime-config.js"></script>
  <script>
    (function alignHostingOriginWithFirebaseAuthDomain() {
      const firebase = window.BAROLI_CONFIG && window.BAROLI_CONFIG.firebase;
      const projectId = firebase && firebase.projectId;
      const authDomain = firebase && firebase.authDomain;
      if (!projectId || !authDomain) return;
      const hostingDomains = new Set([`${projectId}.web.app`, `${projectId}.firebaseapp.com`]);
      if (window.location.protocol === 'https:' && hostingDomains.has(window.location.hostname) && window.location.hostname !== authDomain) {
        const target = `https://${authDomain}${window.location.pathname}${window.location.search}${window.location.hash}`;
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <div id="setup-warning" class="setup-warning" hidden></div>
  <main id="login-view" class="login-layout" hidden>
    <section class="login-card">
      <img class="brand-logo" src="https://widesysw2689.s3.amazonaws.com/images/logo-1x1.jpg" alt="Baroli Imóveis" width="64" height="64" decoding="async" fetchpriority="high">
      <p class="eyebrow">Baroli Imóveis</p>
      <h1>Administração</h1>
      <p class="muted-text">Acesse com sua conta autorizada.</p>
      <form id="login-form" class="stack">
        <label class="field">E-mail<input id="email" type="email" autocomplete="email" required></label>
        <label class="field">Senha<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Entrar</button>
      </form>
      <button class="secondary" id="google-login">Continuar com Google</button>
      <button class="link-button" id="forgot-password">Esqueci minha senha</button>
      <p id="login-error" class="error-text" aria-live="polite"></p>
    </section>
  </main>

  <div id="app-view" class="app-shell" hidden>
    <header class="mobile-appbar" aria-label="Navegação móvel">
      <button id="mobile-menu-button" class="mobile-menu-button" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <div class="mobile-brand">
        <img src="https://widesysw2689.s3.amazonaws.com/images/logo-1x1.jpg" alt="" width="32" height="32">
        <strong>Baroli Admin</strong>
      </div>
      <a id="mobile-profile-link" class="mobile-profile-button" href="#/profile" aria-label="Abrir meu perfil"><span id="mobile-profile-fallback">U</span></a>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="brand sidebar-brand">
        <img class="brand-logo small" src="https://widesysw2689.s3.amazonaws.com/images/logo-1x1.jpg" alt="" width="42" height="42" decoding="async">
        <div class="brand-copy"><strong>Baroli</strong><small>Administração</small></div>
        <button id="sidebar-collapse" class="sidebar-collapse" type="button" aria-label="Recolher menu" title="Recolher menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav id="navigation" aria-label="Menu principal"></nav>
      <div class="sidebar-account">
        <a class="sidebar-profile-link" id="sidebar-profile-link" href="#/profile" title="Meu perfil">
          <span class="shell-avatar" id="shell-avatar"><span id="shell-avatar-fallback">U</span></span>
          <span class="shell-profile-copy"><strong id="shell-profile-name">Meu perfil</strong><small id="shell-profile-role">Conta</small></span>
          <span class="shell-profile-chevron" aria-hidden="true">›</span>
        </a>
        <button id="logout" class="secondary sidebar-logout" title="Sair">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M14 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </aside>
    <button id="mobile-backdrop" class="mobile-backdrop" type="button" aria-label="Fechar menu"></button>
    <section class="content-shell"><div id="content"></div></section>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
