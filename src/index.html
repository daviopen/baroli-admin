<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Baroli Admin</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/app.css">
  <script src="/config/runtime-config.js"></script>
</head>
<body>
  <div id="setup-warning" class="setup-warning" hidden></div>
  <main id="login-view" class="login-layout" hidden>
    <section class="login-card">
      <div class="brand-mark">B</div>
      <p class="eyebrow">Baroli Imóveis</p>
      <h1>Administração</h1>
      <p class="muted-text">Acesse com sua conta autorizada.</p>
      <form id="login-form" class="stack">
        <label class="field">E-mail<input id="email" type="email" autocomplete="email" required></label>
        <label class="field">Senha<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Entrar</button>
      </form>
      <button class="secondary" id="google-login">Continuar com Google</button>
      <button class="link-button" id="forgot-password">Esqueci minha senha</button>
      <p id="login-error" class="error-text" aria-live="polite"></p>
    </section>
  </main>

  <div id="app-view" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark small">B</span><div><strong>Baroli</strong><small>Admin</small></div></div>
      <nav id="navigation"></nav>
      <button id="logout" class="secondary logout">Sair</button>
    </aside>
    <main id="content" class="content"><div class="loading">Carregando...</div></main>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
