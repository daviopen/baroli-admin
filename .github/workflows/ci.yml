name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_FUNCTIONS_REGION: ${{ vars.FIREBASE_FUNCTIONS_REGION }}
      FIREBASE_FUNCTIONS_ENABLED: "false"
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Install Functions dependencies
        run: npm install --ignore-scripts
        working-directory: functions
      - name: Build and test
        run: npm run check

  deploy:
    name: Deploy Firebase
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: baroli-admin-firebase-production
      cancel-in-progress: true
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_FUNCTIONS_REGION: ${{ vars.FIREBASE_FUNCTIONS_REGION }}
      FIREBASE_FUNCTIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Functions dependencies
        run: npm install --ignore-scripts
        working-directory: functions
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAROLI_ADMIN }}
      - name: Read canonical Firebase Web configuration
        run: |
          npx firebase apps:sdkconfig WEB --project "$FIREBASE_PROJECT_ID" --json > /tmp/firebase-sdk.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/firebase-sdk.json', 'utf8'));
          const config = payload?.result?.sdkConfig;
          if (!config?.apiKey || !config?.appId || !config?.projectId) {
            throw new Error('Firebase Web SDK config could not be resolved.');
          }
          const values = {
            FIREBASE_API_KEY: config.apiKey,
            FIREBASE_AUTH_DOMAIN: config.authDomain ?? '',
            FIREBASE_PROJECT_ID: config.projectId,
            FIREBASE_STORAGE_BUCKET: config.storageBucket ?? '',
            FIREBASE_MESSAGING_SENDER_ID: config.messagingSenderId ?? '',
            FIREBASE_APP_ID: config.appId,
            FIREBASE_MEASUREMENT_ID: config.measurementId ?? '',
            FIREBASE_FUNCTIONS_ENABLED: 'false'
          };
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values)
            .map(([key, value]) => `${key}=${value}`)
            .join('\n') + '\n');
          NODE
      - name: Build application
        run: npm run build
      - name: Deploy Hosting and Firestore
        run: npx firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore:rules,firestore:indexes --non-interactive
      - name: Smoke test production runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${FIREBASE_PROJECT_ID}.web.app"
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "${BASE_URL}/config/runtime-config.js?commit=${GITHUB_SHA}" \
              -o /tmp/runtime-config.js && break
            if [ "$attempt" -eq 5 ]; then
              echo "Não foi possível ler o runtime publicado."
              exit 1
            fi
            sleep 3
          done
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('/tmp/runtime-config.js', 'utf8');
          const match = source.match(/window\.BAROLI_CONFIG\s*=\s*(\{[\s\S]*\});\s*$/);
          if (!match) throw new Error('Runtime publicado é inválido.');
          const runtime = JSON.parse(match[1]);
          if (runtime.firebase?.projectId !== process.env.FIREBASE_PROJECT_ID) {
            throw new Error(`Projeto publicado incorreto: ${runtime.firebase?.projectId ?? 'ausente'}`);
          }
          if (!runtime.firebase?.apiKey || !runtime.firebase?.appId) {
            throw new Error('Configuração Firebase pública incompleta.');
          }
          const expectedAuthDomain = `${process.env.FIREBASE_PROJECT_ID}.web.app`;
          if (runtime.firebase?.authDomain !== expectedAuthDomain) {
            throw new Error(`authDomain publicado incorreto: ${runtime.firebase?.authDomain ?? 'ausente'}; esperado ${expectedAuthDomain}`);
          }
          if (runtime.functionsEnabled !== false) {
            throw new Error('Cloud Functions foram habilitadas no cliente antes do backend estar publicado.');
          }
          console.log(`Runtime de produção validado com authDomain first-party: ${expectedAuthDomain}.`);
          NODE
          curl --fail --silent --show-error "${BASE_URL}/__/firebase/init.json" -o /tmp/firebase-init.json
          node <<'NODE'
          const fs = require('node:fs');
          const init = JSON.parse(fs.readFileSync('/tmp/firebase-init.json', 'utf8'));
          if (init.projectId !== process.env.FIREBASE_PROJECT_ID) {
            throw new Error(`Firebase Hosting auth helper aponta para projeto incorreto: ${init.projectId ?? 'ausente'}`);
          }
          NODE
          SESSION_SOURCE="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${BASE_URL}/services/session.service.js?commit=${GITHUB_SHA}")"
          echo "$SESSION_SOURCE" | grep -F "lastAccessAt: firestoreSdk.serverTimestamp()" >/dev/null
          if echo "$SESSION_SOURCE" | grep -F "recordSessionLogin" >/dev/null; then
            echo "Dependência antiga de Cloud Function para login ainda está publicada."
            exit 1
          fi
          AUTH_SOURCE="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${BASE_URL}/features/auth/auth.js?commit=${GITHUB_SHA}")"
          echo "$AUTH_SOURCE" | grep -F "signInWithPopup(auth, provider)" >/dev/null
          echo "$AUTH_SOURCE" | grep -F "signInWithRedirect(auth, provider)" >/dev/null
          echo "$AUTH_SOURCE" | grep -F "getRedirectResult(auth)" >/dev/null
          echo "$AUTH_SOURCE" | grep -F "browserLocalPersistence" >/dev/null
          echo "$AUTH_SOURCE" | grep -F "googleAuthStrategy" >/dev/null
          APP_CSS_SOURCE="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${BASE_URL}/styles/app.css?commit=${GITHUB_SHA}")"
          echo "$APP_CSS_SOURCE" | grep -F "[hidden]" >/dev/null
          echo "$APP_CSS_SOURCE" | grep -F "display: none !important" >/dev/null
          HEADERS="$(curl --fail --silent --show-error -I -H 'Cache-Control: no-cache' "${BASE_URL}/config/runtime-config.js?commit=${GITHUB_SHA}")"
          echo "$HEADERS" | grep -i '^cache-control:' | grep -Ei 'no-cache|no-store' >/dev/null
          echo "Smoke test de produção concluído com autenticação Google híbrida alinhada ao louvor-ide."
      - name: Validate production login with temporary user
        run: node scripts/production-auth-smoke.js
        working-directory: functions
