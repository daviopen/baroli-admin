name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Install Functions dependencies
        run: npm install --ignore-scripts
        working-directory: functions
      - name: Build and test
        run: npm run check
