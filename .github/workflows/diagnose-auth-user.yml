name: Diagnose Auth User

on:
  push:
    branches: [diagnose/davitads-google-login]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        run: npm install --ignore-scripts
        working-directory: functions
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAROLI_ADMIN }}
      - name: Diagnose davitads Google login
        run: node scripts/diagnose-auth-user.js
        working-directory: functions
      - name: Diagnose Google provider configuration
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth application-default print-access-token)"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/${FIREBASE_PROJECT_ID}/defaultSupportedIdpConfigs/google.com" \
            -o /tmp/google-provider.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/google-provider.json', 'utf8'));
          console.log(JSON.stringify({
            name: config.name,
            enabled: config.enabled,
            clientId: config.clientId || null
          }, null, 2));
          NODE
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/${FIREBASE_PROJECT_ID}/config" \
            -o /tmp/auth-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/auth-config.json', 'utf8'));
          console.log(JSON.stringify({ authorizedDomains: config.authorizedDomains || [] }, null, 2));
          NODE
